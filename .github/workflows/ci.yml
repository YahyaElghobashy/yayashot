name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sealed-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Sealed source check
        run: Tools/check-sealed.sh
      - name: Build (developer variant, ad-hoc signed)
        run: ./build.sh --dev
      - name: Sealed binary check
        run: Tools/check-sealed.sh "dist/YayaShot (Developer).app"
